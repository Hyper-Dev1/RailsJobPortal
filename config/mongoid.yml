development:
  clients:
    default:
      uri: mongodb+srv://root:root@cluster0.ea4mx.mongodb.net/jobPortal?retryWrites=true&w=majority
      # OR using separate parameters (replace with your actual credentials)
      # database: job_portal_development
      # hosts:
      #   - cluster0.mongodb.net:27017
      # options:
      #   user: <your-atlas-username>
      #   password: <your-atlas-password>
      #   auth_source: admin
      #   ssl: true
      #   retry_writes: true

  options:
    use_utc: true

test:
  clients:
    default:
      uri: mongodb+srv://root:root@cluster0.ea4mx.mongodb.net/jobPortal?retryWrites=true&w=majority
      # Alternatively, use separate parameters here for the test database
      # database: job_portal_test
      # hosts:
      #   - cluster0.mongodb.net:27017
      # options:
      #   user: <your-atlas-username>
      #   password: <your-atlas-password>
      #   auth_source: admin
      #   ssl: true
      #   retry_writes: true
